server {
    listen 80;
    listen [::]:80;
    server_name openvibe.markets www.openvibe.markets;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.markets$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.markets;
    ssl_certificate /etc/letsencrypt/live/openvibe.markets/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.markets/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://openvibe.markets$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.markets;
    ssl_certificate /etc/letsencrypt/live/openvibe.markets/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.markets/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~* ^/internal(/|$) { return 404; }
    location ~* ^/metrics(/|$) { return 404; }
    location / { proxy_pass http://127.0.0.1:5294; }
    location ~ /\.(?!well-known) { deny all; }
}
